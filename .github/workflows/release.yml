name: Release

# Publishes a GitHub Release with an installable APK.
#   - Push a tag like v1.0.0:        git tag v1.0.0 && git push origin v1.0.0
#   - or use Actions > Release > Run workflow and type a version such as 1.0.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version number, e.g. 1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: v
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$GITHUB_REF_NAME"
          fi
          VERSION="${VERSION#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+)*([-+][0-9A-Za-z.]+)?$'; then
            echo "Version '$VERSION' does not look like 1.2.3" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key (if you added one)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          VERSION: ${{ steps.v.outputs.version }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PversionName="$VERSION" \
            -PversionCode="$GITHUB_RUN_NUMBER" \
            --stacktrace

      - name: Name the APK and write release notes
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/MindYourApps-v${VERSION}.apk"
          (cd dist && sha256sum "MindYourApps-v${VERSION}.apk" > "MindYourApps-v${VERSION}.apk.sha256")
          {
            echo "## Install"
            echo
            echo "1. On your Android phone, download **MindYourApps-v${VERSION}.apk** below."
            echo "2. Open it. If Android asks, allow your browser or file manager to install unknown apps."
            echo "3. Open Mind Your Apps and follow the short setup (turn on its accessibility service)."
            echo
            echo "Android 13 and newer: if the accessibility switch is greyed out, open the app's info page, tap the three dots and choose **Allow restricted settings**. The app walks you through it."
            if [ "$SIGNED" != "true" ]; then
              echo
              echo "> This build is signed with a temporary key, so it cannot be installed over a different build. Uninstall the old version first. Maintainers: see the README to add a permanent signing key."
            fi
          } > release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Mind Your Apps v${{ steps.v.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: true
          make_latest: true
          files: |
            dist/MindYourApps-v${{ steps.v.outputs.version }}.apk
            dist/MindYourApps-v${{ steps.v.outputs.version }}.apk.sha256
